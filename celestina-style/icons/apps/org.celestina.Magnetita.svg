  <path d="M495.2 256.0L495.1 327.6L494.8 350.5L494.2 367.0L493.4 380.4L492.4 391.9L491.1 401.9L489.6 410.8L487.8 418.9L485.8 426.3L483.5 433.1L481.0 439.3L478.2 445.1L475.2 450.5L471.8 455.4L468.2 460.0L464.3 464.3L460.0 468.2L455.4 471.8L450.5 475.2L445.1 478.2L439.3 481.0L433.1 483.5L426.3 485.8L418.9 487.8L410.8 489.6L401.9 491.1L391.9 492.4L380.4 493.4L367.0 494.2L350.5 494.8L327.6 495.1L256.0 495.2L184.4 495.1L161.5 494.8L145.0 494.2L131.6 493.4L120.1 492.4L110.1 491.1L101.2 489.6L93.1 487.8L85.7 485.8L78.9 483.5L72.7 481.0L66.9 478.2L61.5 475.2L56.6 471.8L52.0 468.2L47.7 464.3L43.8 460.0L40.2 455.4L36.8 450.5L33.8 445.1L31.0 439.3L28.5 433.1L26.2 426.3L24.2 418.9L22.4 410.8L20.9 401.9L19.6 391.9L18.6 380.4L17.8 367.0L17.2 350.5L16.9 327.6L16.8 256.0L16.9 184.4L17.2 161.5L17.8 145.0L18.6 131.6L19.6 120.1L20.9 110.1L22.4 101.2L24.2 93.1L26.2 85.7L28.5 78.9L31.0 72.7L33.8 66.9L36.8 61.5L40.2 56.6L43.8 52.0L47.7 47.7L52.0 43.8L56.6 40.2L61.5 36.8L66.9 33.8L72.7 31.0L78.9 28.5L85.7 26.2L93.1 24.2L101.2 22.4L110.1 20.9L120.1 19.6L131.6 18.6L145.0 17.8L161.5 17.2L184.4 16.9L256.0 16.8L327.6 16.9L350.5 17.2L367.0 17.8L380.4 18.6L391.9 19.6L401.9 20.9L410.8 22.4L418.9 24.2L426.3 26.2L433.1 28.5L439.3 31.0L445.1 33.8L450.5 36.8L455.4 40.2L460.0 43.8L464.3 47.7L468.2 52.0L471.8 56.6L475.2 61.5L478.2 66.9L481.0 72.7L483.5 78.9L485.8 85.7L487.8 93.1L489.6 101.2L491.1 110.1L492.4 120.1L493.4 131.6L494.2 145.0L494.8 161.5L495.1 184.4Z" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Octahedron. T top, L/R side vertices, N near vertex (below centre), B bottom. -->
  <!-- upper-left face, catching the light -->
  <path d="M256 100 110 250 256 308Z" fill="url(#oct-tl)"/>
  <!-- upper-right face -->
  <path d="M256 100 256 308 402 250Z" fill="url(#oct-tr)"/>
  <!-- lower-left face -->
  <path d="M110 250 256 308 256 415Z" fill="url(#oct-bl)"/>
  <!-- lower-right face, turned furthest from the light -->
  <path d="M402 250 256 308 256 415Z" fill="url(#oct-br)"/>
  <!-- the lit edge along the two upper faces, a cleavage plane catching light -->
  <path d="M110 250 256 100 402 250" fill="none" stroke="#EEF4FB"
        stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>
</svg>
