<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Grafita</title>
  <!--
    Graphite's habit is a stack of hexagonal sheets, and the sheets are the
    whole point: they shear apart under a fingernail, which is why a pencil
    writes. So the mark is three plates seen from slightly above, their front
    rims visible as separate layers rather than one solid block.

    Geometry is a flattened hexagon repeated down the stack, so the shape stays
    true if the numbers are ever tuned:
      centre x = 256, top face cy = 150, rx = 118, ry = 62
      slab thickness = 30, step between sheets = 38
    The group transform only centres and scales that stack inside the tile.

    Colour is the mineral's: a cool metallic grey, the neutral counterpart to
    Siderita's warm amber. The document-page glyph is left to every other text
    editor on the system.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252C"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#DDE2EA"/>
      <stop offset="1" stop-color="#98A1AE"/>
    </linearGradient>
    <linearGradient id="sheet-0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA3B0"/>
      <stop offset="1" stop-color="#6B7380"/>
    </linearGradient>
    <linearGradient id="sheet-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8794"/>
      <stop offset="1" stop-color="#565E6A"/>
    </linearGradient>
    <linearGradient id="sheet-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666E7A"/>
      <stop offset="1" stop-color="#434A55"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

