  <!-- Centre the stack (its box spans 138..374 x 88..318) and fill ~72%. -->
  <g transform="translate(256 256) scale(1.24) translate(-256 -203)">
    <path d="M374 226 315 288 197 288 138 226 138 256 197 318 315 318 374 256Z" fill="url(#sheet-2)"/>
    <path d="M374 188 315 250 197 250 138 188 138 218 197 280 315 280 374 218Z" fill="url(#sheet-1)"/>
    <path d="M374 150 315 212 197 212 138 150 138 180 197 242 315 242 374 180Z" fill="url(#sheet-0)"/>
    <path d="M374 150 315 212 197 212 138 150 197 88 315 88Z" fill="url(#face)"/>
    <path d="M138 150 L197 88 L315 88 L374 150" fill="none" stroke="#F2F5F9" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
