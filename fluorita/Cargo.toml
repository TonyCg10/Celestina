[package]
name = "fluorita"
version = "1.2.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "fluorita"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# The suite's canonical percent codec, so a `file://` argument from the desktop
# is decoded the same way every other project decodes one.
celestina-core = { path = "../celestina-rs/crates/celestina-core" }
# What media *is*: kind classification, the library projections and the
# playback model. Classifying a path costs no decoder, which is why the
# scaffold can be honest about what it was handed without starting one.
fluorita-core = { path = "../celestina-rs/crates/fluorita-core" }
# The decoder itself. The app never talks to libmpv: it opens sessions through
# the engine's narrow contract and hands the surface one opaque handle.
fluorita-engine = { path = "../celestina-rs/crates/fluorita-engine" }
# The freedesktop Trash spec has one owner in this monorepo, and this is it: a
# pure crate over `celestina-core` that reserves the info file with `O_EXCL`,
# renames when it can, copies-verifies-removes across filesystems and rolls back
# on failure. Reimplementing "delete" in a media player instead would be a
# second, less careful implementation of a rule that must not have two.
siderita-ops = { path = "../celestina-rs/crates/siderita-ops" }

# MPRIS2: how a shell panel, the media keys and Magnetita's phone link read one
# source of truth instead of three. Already the suite's D-Bus crate (Siderita's
# portal backend and the Magnetita daemon use it); its blocking API keeps the
# publisher on its own thread instead of dragging an async runtime into a Qt app.
zbus = "5"

[build-dependencies]
# The render seam: the hand-written `QQuickFramebufferObject` that drives
# libmpv's render API lives in a crate now that a second host — Siderita's
# embedded modal — needs the same one. A build dependency because what it hands
# over is source paths, not behaviour.
fluorita-qt = { path = "../celestina-rs/crates/fluorita-qt" }
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
