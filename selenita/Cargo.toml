[package]
name = "selenita"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "selenita"
path = "src/main.rs"

[dependencies]
# The Rust/C++ bridge beneath CXX-Qt, the suite's way of writing Qt objects in
# Rust (architecture standard). Pinned exactly beside `cxx-gen` below, so the
# generated C++ and the runtime come from one release.
cxx = "=1.0.176"
# The controller, the activation adapter and the appearance follower are
# QObjects written in Rust (`#[cxx_qt::bridge]`); `Threading` queues the bus
# and watcher threads' requests onto the Qt thread. Pinned with
# `cxx-qt-build`.
cxx-qt = "=0.9.1"
# Qt's types on the Rust side (QString, QUrl, the application and the QML
# engine); only the GUI, QML and Quick Controls parts this window needs.
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# Selenita's domain (targets, file names, history, the niri client, the tool
# argv and their runner), tested without Qt.
selenita-core = { path = "../celestina-rs/crates/selenita-core" }
# Single instance: a second `selenita` brings the running window forward.
# The claim-first hand-off is the suite's one owner in `celestina-core`
# (feature `activation`, which brings zbus 5 for the session bus). Besides
# it Selenita uses the crate's `file_uri`, `atomic_file`, `xdg` and
# `CancellationToken`.
celestina-core = { path = "../celestina-rs/crates/celestina-core", features = ["activation"] }
# The extra `org.celestina.Selenita1` interface served on the activation
# connection, its client half for `--screenshot`, and the file manager's
# `ShowItems`. The same zbus 5 `celestina-core`'s activation already links,
# with the same blocking API and runtime.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# «Eliminar» moves a capture to the freedesktop trash through the suite's one
# implementation, so Siderita can restore it.
siderita-ops = { path = "../celestina-rs/crates/siderita-ops" }
# The PipeWire remote the portal hands over arrives without close-on-exec;
# `fcntl_setfd` is the safe call that sets it. The crate is already in the
# closure through zbus.
rustix = { version = "1", default-features = false, features = ["std"] }
# The suite's appearance file (reduced motion, text scale) and its follower,
# so this window follows the same choice as every other one.
celestina-settings = { path = "../celestina-rs/crates/celestina-settings" }

[build-dependencies]
# Generates the C++ half of the bridges, compiles it and builds the QML module
# (`org.celestina.selenita`) with its resources.
cxx-qt-build = "=0.9.1"
# The C++ generator `cxx-qt-build` drives, pinned to the release matching
# `cxx` above.
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
