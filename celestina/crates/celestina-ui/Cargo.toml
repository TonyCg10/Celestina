[package]
name = "celestina-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The shell's UI tree: taffy layout, keyed reconciliation, animation, hit-test, focus and the text field"

[lints]
workspace = true

[dependencies]
# `Rect`, the hit-test and paint geometry, and `InputEvent`, the pointer and
# key events `Interaction` turns into `UiEvent`s.
celestina-wayland = { path = "../celestina-wayland" }
# The painter the paint walk draws through, the text system the layout
# measures with, and the theme's roles, motion ladder and press scale.
celestina-paint = { path = "../celestina-paint" }
# Flexbox and block layout over the node tree. `taffy_tree` is the
# `TaffyTree` container the tree keeps its layout twins in; grid, floats,
# `calc` and the content-size and detailed-info extras are not used.
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout"] }
# Typed errors with their sources.
thiserror = "2"
# The text field moves and deletes by extended grapheme cluster (a letter
# with a combining accent, a flag) and jumps by Unicode word boundary;
# `str::chars` cannot do either. Already in the lockfile through cosmic-text.
unicode-segmentation = "1"
# `Secret` (the polkit prompt's password buffer, and the lock screen's after
# it) wipes its bytes with `Zeroize` when a character is removed, when it is
# cleared and when it is dropped, and the field wipes the key text of the
# events it consumes; `Zeroizing` ties the wipe to ownership so every path,
# including an unwind, ends in a zero buffer. The release profile unwinds.
# `std::ptr::write_volatile` would need `unsafe`; this crate forbids it.
zeroize = "1"
