[package]
name = "celestina-fake-system"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Test support: fake UPower, power-profiles-daemon, NetworkManager and BlueZ on a private bus"
publish = false

[lints]
workspace = true

# Only `celestina` names this crate, and only under `[dev-dependencies]`, so
# no shipped build (the binary, the library) links it. It depends on nothing
# of the shell.
[dependencies]
# The fakes serve the four services in-process; the same features the shell
# uses (blocking API on zbus's own async-io thread).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
