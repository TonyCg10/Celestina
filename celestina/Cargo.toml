[workspace]
members = ["crates/*", "."]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "celestina"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Celestina shell for niri: the Island, the launcher, notifications and the tray"

[lints]
workspace = true
