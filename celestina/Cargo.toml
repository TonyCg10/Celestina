[workspace]
members = ["crates/*", "."]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "celestina"
version = "1.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Celestina shell for niri: the Island, the launcher, notifications and the tray"

[lints]
workspace = true

# The product is a library plus a thin binary: `src/lib.rs` holds the modules
# (the app, the Island, the command surface, the bus and the providers), so
# every module is public API exercised by its tests, and `src/main.rs` only
# parses arguments and runs it.
[lib]
name = "celestina"
path = "src/lib.rs"

[[bin]]
name = "celestina"
path = "src/main.rs"

# Test support: fake UPower, power-profiles-daemon, NetworkManager and BlueZ
# on a private bus, a crate of its own and named only here, so no shipped
# build links it (a feature on this package would change the binary that
# `cargo test` leaves in target/<profile>).
[dev-dependencies]
celestina-fake-system = { path = "crates/celestina-fake-system" }

[dependencies]
# The runtime: outputs, the Island's layer surfaces, regions, frame pacing
# and the loop's `Sender`, through which every provider worker publishes its
# typed messages (design §5.1, §5.2).
celestina-wayland = { path = "crates/celestina-wayland" }
# The one painter of the process, the theme and the fonts the Island is drawn
# with (design §5.3).
celestina-paint = { path = "crates/celestina-paint" }
# The keyed view tree the Island's capsule and page are described in, its
# layout, animation and interaction (design §5.4).
celestina-ui = { path = "crates/celestina-ui" }
# The flex alignment (centring) of the Island's views, set on
# `celestina_ui::View::style`, which is a `taffy::Style`; the version
# `celestina-ui` lays out with.
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox"] }
# `org.celestina.Shell1`: the shell serves the command surface and claims
# `org.celestina.Shell` with `DoNotQueue` (single instance), and the client
# verbs call it. Blocking API only, on zbus's own async-io thread: no async
# executor in the shell (design §6.4), as `celestina-core`'s activation does.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# The compositor's own event and request types, pinned to the release the
# author's niri speaks; the stream is parsed line by line with serde_json so
# an unknown variant is skipped instead of ending the stream (design §5.6).
niri-ipc = "=26.4.0"
serde_json = "1"
# The suite's shared owners: the XDG base directory, the bounded read and the
# atomic private write (celestina-core); the appearance file and its follower
# (celestina-settings); the pure shell domain salvaged from the halted shell
# (celestina-shell). Path dependencies into the suite workspace.
celestina-core = { path = "../celestina-rs/crates/celestina-core" }
celestina-settings = { path = "../celestina-rs/crates/celestina-settings" }
celestina-shell = { path = "../celestina-rs/crates/celestina-shell" }
# Diagnostics to stderr (journald under the session); the toolkit crates log
# through the same facade.
tracing = "0.1"
# The binary's subscriber: stderr, filtered by `RUST_LOG` (default `info`).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
# Window titles on the Activity page are cut at 48 extended grapheme
# clusters, so an emoji sequence or an accented letter is never split;
# `str::chars` cannot count that. Already in the lockfile through cosmic-text.
unicode-segmentation = "1"
# Typed errors with their sources, as in the toolkit crates.
thiserror = "2"
# Wallpaper decoding (CEL-2-E): the still image of each output is read from a
# file the author chose, so it is hostile input. Pinned to the release the
# halted shell already audited; default features off so only the three
# accepted formats are compiled (png, jpeg, webp — no AVIF, which would pull
# a C decoder into the process), with `Limits` bounding dimensions and
# allocation. Decoding and Lanczos scaling run on the wallpaper worker.
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
# The wallpaper file is opened with `O_NONBLOCK` so a FIFO named like an
# image cannot block the worker before `fstat` rejects it; std has no flag
# constant and the workspace forbids the unsafe a raw libc call needs. Already
# in the lockfile through the Wayland stack. CEL-2-B: the gamma ramp travels in
# an anonymous memory file (`memfd_create`), and the energy workers wait on
# their own Wayland connection (`event`). CEL-2-J: the Melibea socket is
# trusted only when it belongs to this process's uid, and std has no safe
# `getuid` (`process`).
rustix = { version = "1", features = ["fs", "event", "process"] }
# The shell follows its own `shell.json` live (CEL-2-E: the wallpaper duty
# turns on and off without a restart), with the same debounced directory
# watch `celestina-settings` uses for the appearance file; the version is the
# one already in the lockfile through that crate.
notify-debouncer-full = "0.5"
# CEL-2-B: the energy workers own a Wayland connection of their own (idle
# notification and gamma control), apart from the Island's runtime, so a
# duty that is off costs no protocol object. `wayland-client` and the
# protocol crates are the versions `celestina-wayland` already resolves.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# CEL-2-K: the `sysmon` piece reads /proc/stat, /proc/meminfo and hwmon
# through Hematita's pure parsers (`cpu`, `memory`, `sensors`) instead of a
# second copy of that parsing; Celestina is a narrow consumer of those
# modules only (docs/standards/architecture.md).
hematita-core = { path = "../celestina-rs/crates/hematita-core" }
# CEL-2-F: the network and Bluetooth workers read NetworkManager and BlueZ
# through Cuprita's own D-Bus clients (`NmNetwork`, `BluezBluetooth`, their
# signal watchers and fakes) instead of a second implementation. Features
# `nm` and `bluez` only: no `wpctl`, so no audio process code is compiled.
cuprita-core = { path = "../celestina-rs/crates/cuprita-core", default-features = false, features = ["nm", "bluez"] }
# CEL-2-C: the on-screen display's timeout and retire are calloop timers on
# the shell's own loop (the handle `celestina_wayland::run` gives its setup);
# the version is the one `celestina-wayland` already resolves.
calloop = "0.14"

# The smoke's media phase (`scripts/smoke.sh`) owns a player on its private
# bus with this; it adds no dependency (zbus is the shell's own) and is not
# part of the shipped artifact.
[[example]]
name = "fake-mpris-player"
path = "examples/fake-mpris-player.rs"
