[package]
name = "grafita"
version = "1.4.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "grafita"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# The whole document: what text is, how it is edited, the open/save state
# machine and the bounded worker. This app adds a window and nothing else, so it
# shares the crate with Siderita's embedded surface rather than restating it.
grafita-core = { path = "../celestina-rs/crates/grafita-core" }
# The suite's one reading of a `file://` URI. A file chooser, a desktop `%u`
# and another launch hand Grafita URIs, and the rule for which of them name a
# local file, byte for byte, belongs to the suite rather than to each app.
# Already linked through grafita-core, so it adds no code to the build.
celestina-core = { path = "../celestina-rs/crates/celestina-core" }
# Single-instance activation: a second `grafita RUTA` hands its document to the
# running window instead of mapping another one. The session bus is how the rest
# of the suite talks between processes, so this earns zbus rather than inventing
# a socket protocol of its own.
zbus = "5"
# Guesses the encoding of a file that is not UTF-8, so the author never has to
# name it. Mozilla's detector (the one Firefox uses), pure Rust. It lives here
# and not in grafita-core because Siderita's editor shares that crate and wants
# no detector: core only maps the guess onto an encoding it writes back byte for
# byte, and discards the guess otherwise. Default features off keeps the
# single-threaded build: `encoding_rs`, `memchr` and `cfg-if` come with it.
chardetng = { version = "1", default-features = false }

[build-dependencies]
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
