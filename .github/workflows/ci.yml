# CI mínima de la suite: contratos verificables sin Qt, workspace celestina-rs
# (cores puros + backend de Magnetita) y el adaptador Rust del shell. CXX/Qt y
# las superficies gráficas requieren la matriz local descrita en AGENTS.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contrato-arquitectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is compared with the state before the whole push or
          # with the PR base, not merely with the previous commit.
          fetch-depth: 0
      - name: Contrato de arquitectura y estilo
        env:
          ARCHITECTURE_COMPARE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-architecture-scanners.sh
          bash scripts/check-architecture-contract.sh

  celestina-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina-rs
    steps:
      - uses: actions/checkout@v4

      # rustup lee celestina-rs/rust-toolchain.toml (1.97.1, clippy + rustfmt).
      - name: Instalar el toolchain pinneado
        run: rustup toolchain install

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('celestina-rs/Cargo.lock', 'celestina-rs/rust-toolchain.toml') }}

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  celestina-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina/target
          key: cargo-celestina-${{ runner.os }}-${{ hashFiles('celestina/Cargo.lock', 'celestina/Cargo.toml') }}

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked
