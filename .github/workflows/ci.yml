# CI mínima de la suite: contrato arquitectónico verificable sin Qt y workspace
# celestina-rs (cores puros + backend de Magnetita). Las apps CXX-Qt y el shell
# requieren el toolchain Qt y, para parte de la UI, una sesión gráfica; su matriz
# local obligatoria vive en AGENTS.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contrato-arquitectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is compared with the state before the whole push or
          # with the PR base, not merely with the previous commit.
          fetch-depth: 0
      - name: Contrato de arquitectura y estilo
        env:
          ARCHITECTURE_COMPARE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-architecture-contract.sh

  celestina-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina-rs
    steps:
      - uses: actions/checkout@v4

      # rustup lee celestina-rs/rust-toolchain.toml (1.97.1, clippy + rustfmt).
      - name: Instalar el toolchain pinneado
        run: rustup toolchain install

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('celestina-rs/Cargo.lock', 'celestina-rs/rust-toolchain.toml') }}

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
