# Shared cores: fmt, clippy, and the workspace test suite.
#
# Run only for `celestina-rs/`. The workspace depends on no application; the
# architecture guard enforces that direction.
name: celestina-rs

on:
  push:
    branches: [main]
    paths:
      - 'celestina-rs/**'
      - '.github/workflows/celestina-rs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'celestina-rs/**'
      - '.github/workflows/celestina-rs.yml'

jobs:
  celestina-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina-rs
    steps:
      - uses: actions/checkout@v4

      # `fluorita-engine` links system libmpv. Bindings are pregenerated, so
      # bindgen and clang are not required.
      - name: Install libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev

      # rustup reads celestina-rs/rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('celestina-rs/Cargo.lock', 'celestina-rs/rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The rest of the workspace. Fluorita engine runs separately below.
      - name: Tests
        run: cargo test --workspace --locked --exclude fluorita-engine

      # Ubuntu 24.04 ships mpv 0.37, which lacks several optional hardening
      # properties. Unknown properties degrade best-effort instead of aborting
      # the instance. `tests/real_media.rs` remains separate because it performs
      # real decoding and requires measured duration/results.
      - name: Fluorita engine tests (without real backend)
        run: cargo test -p fluorita-engine --lib --locked
