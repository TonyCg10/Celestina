# Los cores compartidos: fmt, clippy y la suite de tests del workspace.
#
# Corre sólo cuando cambia `celestina-rs/`. Ningún otro proyecto puede alterar
# este resultado: el workspace no depende de ninguno de ellos, y esa dirección
# de dependencias es precisamente lo que el guard de arquitectura vigila.
name: celestina-rs

on:
  push:
    branches: [main]
    paths:
      - 'celestina-rs/**'
      - '.github/workflows/celestina-rs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'celestina-rs/**'
      - '.github/workflows/celestina-rs.yml'

jobs:
  celestina-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina-rs
    steps:
      - uses: actions/checkout@v4

      # `fluorita-engine` enlaza contra la libmpv del sistema
      # (`cargo:rustc-link-lib=mpv`), así que sin esto el workspace compila
      # hasta que toca enlazar y falla con `cannot find -lmpv`. Los bindings van
      # pregenerados en el crate, de modo que no hacen falta bindgen ni clang.
      - name: Instalar libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev

      # rustup lee celestina-rs/rust-toolchain.toml (1.97.1, clippy + rustfmt).
      - name: Instalar el toolchain pinneado
        run: rustup toolchain install

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('celestina-rs/Cargo.lock', 'celestina-rs/rust-toolchain.toml') }}

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # El resto del workspace entero. `fluorita-engine` va aparte porque sus
      # pruebas contra el backend real no caben aquí — ver el paso siguiente.
      - name: Tests
        run: cargo test --workspace --locked --exclude fluorita-engine

      # `fluorita-engine` se compila, enlaza y pasa sus pruebas, incluida
      # `an_instance_starts_and_answers_properties`. Esta corría aparte hasta
      # 2026-08-02: el runner de Ubuntu 24.04 trae mpv 0.37, y el baseline del
      # motor fijaba en modo obligatorio unas opciones de hardening
      # (`load-console`, `load-select`, `load-positioning`, …) que esa versión
      # no conoce, así que `set_property` respondía -8 y abortaba la instancia
      # entera. `instance.rs` ahora aplica ese hardening en modo mejor
      # esfuerzo — una opción desconocida degrada, no bloquea — así que la
      # ausencia de esas siete propiedades en mpv viejo ya no es una decisión
      # pendiente del autor: la instancia se crea igual.
      # `tests/real_media.rs` sigue aparte porque decodifica de verdad y eso sí
      # exige duración/resultados medidos, no sólo que la instancia exista.
      - name: Tests de fluorita-engine (sin backend real)
        run: cargo test -p fluorita-engine --lib --locked
