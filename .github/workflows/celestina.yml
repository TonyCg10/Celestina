# Shell Rust adapter: fmt, clippy, and package tests.
#
# Include all of `celestina-rs/` because the package consumes path-based cores.
# A fixed crate list would silently become stale when Cargo.toml gains a new
# dependency. Running extra checks is recoverable; silently skipping them is not.
name: celestina

on:
  push:
    branches: [main]
    paths:
      - 'celestina/**'
      - 'celestina-rs/**'
      - '.github/workflows/celestina.yml'
  pull_request:
    branches: [main]
    paths:
      - 'celestina/**'
      - 'celestina-rs/**'
      - '.github/workflows/celestina.yml'

jobs:
  celestina-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina/target
          key: cargo-celestina-${{ runner.os }}-${{ hashFiles('celestina/Cargo.lock', 'celestina/Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked
