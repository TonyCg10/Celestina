# Rust shell: fmt, clippy, and the workspace tests of `celestina/`.
#
# The shell's own workspace (`celestina/Cargo.toml`, members `crates/*` and the
# binary) plus the two `celestina-rs` crates registered for it, whose changes
# the shell will consume. The halted Qt shell runs in `celestina-qt.yml`.
name: celestina

on:
  push:
    branches: [main]
    paths:
      - 'celestina/**'
      - 'celestina-rs/crates/celestina-shell/**'
      - 'celestina-rs/crates/celestina-tokens/**'
      - '.github/workflows/celestina.yml'
  pull_request:
    branches: [main]
    paths:
      - 'celestina/**'
      - 'celestina-rs/crates/celestina-shell/**'
      - 'celestina-rs/crates/celestina-tokens/**'
      - '.github/workflows/celestina.yml'

jobs:
  celestina:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      # System libraries the shell's crates link, read from their build
      # scripts: `wayland-sys` (features `client` and `egl`, no `dlopen`)
      # probes `wayland-client.pc` and `wayland-egl.pc`, both shipped by
      # libwayland-dev; `smithay-client-toolkit` probes `xkbcommon.pc` and the `xkbcommon`
      # crate links `-lxkbcommon`, both from libxkbcommon-dev.
      # The protocol XML is bundled by `wayland-protocols*`, EGL is loaded
      # at run time by `khronos-egl`, and fonts are read in pure Rust.
      # `celestina-lock-verify` links `-lpam` (the PAM verifier), shipped by
      # libpam0g-dev.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libpam0g-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina/target
          key: cargo-celestina-${{ runner.os }}-${{ hashFiles('celestina/Cargo.lock', 'celestina/Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
