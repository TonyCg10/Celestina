# Shell Rust adapter: fmt, clippy, and package tests.
#
# Include all of `celestina-rs/` because the package consumes path-based cores.
# A fixed crate list would silently become stale when Cargo.toml gains a new
# dependency. Running extra checks is recoverable; silently skipping them is not.
name: celestina-qt

on:
  push:
    branches: [main]
    paths:
      - 'celestina-qt/**'
      - 'celestina-rs/**'
      - '.github/workflows/celestina-qt.yml'
  pull_request:
    branches: [main]
    paths:
      - 'celestina-qt/**'
      - 'celestina-rs/**'
      - '.github/workflows/celestina-qt.yml'

jobs:
  celestina-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestina-qt
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      # `dav1d-sys` (pulled in by `image` with `avif-native`) probes
      # `dav1d.pc` with `dav1d >= 1.3.0`, shipped by libdav1d-dev.
      # `wayland-sys` (via the direct `wayland-client` dependency, no
      # `dlopen`) probes `wayland-client.pc`, shipped by libwayland-dev.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev libwayland-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            celestina-qt/target
          key: cargo-celestina-qt-${{ runner.os }}-${{ hashFiles('celestina-qt/Cargo.lock', 'celestina-qt/Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked
