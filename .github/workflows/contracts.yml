# Cross-suite contracts: architecture, style, documentation, language, versions,
# and Git.
# This workflow intentionally has no path filter because it verifies relations
# between projects.
name: contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare baseline debt with the state before the push or the PR base.
          fetch-depth: 0

      - name: Architecture and style contracts
        env:
          ARCHITECTURE_COMPARE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-architecture-scanners.sh
          bash scripts/check-architecture-contract.sh

      - name: Documentation, language, versions, and agent context
        env:
          LANGUAGE_COMPARE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-documentation-contract.sh
          bash scripts/check-documentation-contract.sh
          python3 scripts/check-language-contract.py
          python3 scripts/test-version-contract.py
          python3 scripts/version_tool.py check
          python3 scripts/audit-version-commits.py

      # Hooks are local by definition (`core.hooksPath` is not transported), so
      # pushed history is replayed here. The replay is partial by design and
      # `.github/workflows/README.md` states exactly which properties it checks
      # and which it does not; do not read this step as a full re-run of the
      # local hooks.
      - name: Commit scope
        run: |
          bash scripts/test-commit-scope.sh
          bash scripts/test-staged-units.sh
