[package]
name = "cuprita"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "cuprita"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# Cuprita's domain: networks, Bluetooth devices and audio endpoints, tested
# without Qt. This binary adds a window, worker threads and nothing else.
cuprita-core = { path = "../celestina-rs/crates/cuprita-core" }
# Single-instance activation: a second `cuprita` raises the running window
# instead of mapping another one. The session bus is how the suite talks
# between processes, so this earns zbus rather than a socket protocol.
zbus = "5"

[build-dependencies]
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
