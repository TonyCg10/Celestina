schema_version = 1

[suite]
id = "suite"
name = "Celestina"
root = "."
commit_prefix = "suite"
agents = "AGENTS.md"
readme = "README.md"
status = "STATUS.md"
roadmap = "ROADMAP.md"
validation = "VALIDATION.md"
active_plans = "docs/plans/active"
allow_all_commit_paths = true
# Cross-cutting rules every local AGENTS.md already requires. They are listed
# here so `scripts/agent-context.py` prints a complete reading order instead of
# leaving an agent to rediscover the standards through link chasing.
shared_rules = [
  "CONTRIBUTING.md",
  "docs/README.md",
  "docs/governance/change-policy.md",
  "docs/governance/documentation.md",
  "docs/standards/architecture.md",
  "docs/standards/rust-cpp-qt-qml.md",
  "docs/standards/verification.md",
  "docs/standards/language.md",
  "docs/contracts/versioning.md",
]

[commit_policy]
subject_format = "<prefix>-<kind>: <English imperative>"
workspace_manifests = ["celestina-rs/Cargo.toml", "celestina-rs/Cargo.lock"]
# Debt ratchets every prefix may lower in the same commit that earns the
# reduction. Splitting them into a follow-up commit would publish a revision
# whose relevant guard already fails.
shared_ratchet_files = [
  "scripts/architecture-baseline.tsv",
  "scripts/language-baseline.tsv",
]

[version_policy]
# Product manifests remain canonical; this file registers how to read them.
# History is append-only and the fixed mapping is enforced by committed code.
history_file = "docs/version-history.tsv"
tag_format = "<project>-v<version>"
bug_increment = "patch"
milestone_increment = "minor"
release_increment = "major"
maintenance_increment = "none"

[[projects]]
id = "celestina"
name = "Celestina shell"
path = "celestina"
kind = "qt-shell"
commit_prefix = "celestina"
version_source = { kind = "cmake-project", path = "celestina/CMakeLists.txt", project = "celestina" }
version_mirrors = [
  { kind = "cargo-package", path = "celestina/Cargo.toml", package = "celestina-shell" },
  { kind = "cargo-lock", path = "celestina/Cargo.lock", package = "celestina-shell" },
]
agents = "celestina/AGENTS.md"
readme = "celestina/README.md"
status = "celestina/STATUS.md"
roadmap = "celestina/ROADMAP.md"
validation = "celestina/VALIDATION.md"
active_plans = "celestina/docs/plans/active"
context_documents = [
  "celestina/docs/discussions/README.md",
  "celestina/docs/decisions/README.md",
]
source_roots = ["celestina/src", "celestina/qml", "celestina-rs/crates/celestina-shell-core"]
commit_roots = ["celestina/", "celestina-rs/crates/celestina-shell-core/"]
include_workspace_manifests = true
production_role = "activatable-shell"
deployable = true
build_script = "celestina/scripts/build-production.sh"
complete_script = "celestina/scripts/complete-production.sh"
verify_script = "celestina/scripts/verify-production.sh"
deploy_script = "celestina/scripts/deploy-production.sh"
activate_script = "celestina/scripts/activate-production.sh"
status_script = "celestina/scripts/status-production.sh"
artifact_manifest = "celestina/build/production-artifact.toml"
artifact_paths = ["celestina/build/celestina", "celestina/build/celestina-lock", "celestina/build/celestina-lock-verify", "celestina/build/libcelestina-lock-session.so", "celestina/build/celestina-polkit-converse", "celestina/build/rust-target/release/celestina-niri-adapter", "celestina/build/rust-target/release/celestina-provider-adapter", "celestina-style/build/libcelestina-style.so", "celestina-style/build/CelestinaStyle", "celestina/scripts/celestina-launcher.sh", "celestina/celestina.desktop"]
production_inputs = ["celestina/celestina.desktop", "celestina/CMakeLists.txt", "celestina/Cargo.toml", "celestina/Cargo.lock", "celestina/src", "celestina/qml", "celestina-style/CMakeLists.txt", "celestina-style/*.qml", "celestina-style/qmldir", "celestina-style/fonts", "celestina-style/icons", "celestina-style/scripts/build-production.sh", "celestina-rs/crates/celestina-shell-core", "celestina-rs/crates/celestina-core", "celestina-rs/crates/magnetita-core"]
verification_inputs = ["celestina/tests", "celestina/scripts/qmllint-production.sh", "celestina/scripts/smoke-production.sh", "celestina-style/tests", "celestina-style/gallery", "celestina-style/scripts/verify-production.sh", "celestina-style/scripts/smoke-production.sh", "celestina-rs/rust-toolchain.toml"]
component_commit_scopes = [
  { prefix = "celestina-shell-core", roots = ["celestina-rs/crates/celestina-shell-core/"], include_workspace_manifests = true },
]

