[package]
name = "siderita"
version = "1.2.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[features]
default = []
qt-minimal = [
    "cxx-qt-build/link_qt_object_files",
    "dep:qt-build-utils",
    "dep:qt-version",
]

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
celestina-core = { path = "../celestina-rs/crates/celestina-core" }
siderita-core = { path = "../celestina-rs/crates/siderita-core" }
siderita-ops = { path = "../celestina-rs/crates/siderita-ops" }
siderita-qt = { path = "../celestina-rs/crates/siderita-qt" }
# The embedded Grafita editor: document, encoding, edit and loss-free save
# rules live there, so this app only marshals them to Qt.
grafita-core = { path = "../celestina-rs/crates/grafita-core" }
# The embedded Fluorita player, authorized as a bounded consumer: what media is
# and what a session may claim live in the core, and the decoding lives in the
# engine. Linking the engine is not loading it — nothing constructs a session
# until `Space` asks for one, which is what keeps browsing free of a decoder.
fluorita-core = { path = "../celestina-rs/crates/fluorita-core" }
fluorita-engine = { path = "../celestina-rs/crates/fluorita-engine" }
# System-bus integration: org.freedesktop.FileManager1 and udisks2 volumes.
zbus = "5"
# Already in the closure (zbus pulls it in); declared here so the portal backend
# can park a held-open request on a real await point instead of a blocked thread.
async-channel = "2"
# Filesystem watch (inotify-backed) with burst coalescing, for auto-refresh.
notify-debouncer-full = "0.5"
# Local-time conversion (localtime_r) for the properties panel timestamps.
libc = "0.2"

[build-dependencies]
# The shared render seam: the same hand-written video surface Fluorita's window
# uses, owned by a crate so neither application depends on the other's tree.
fluorita-qt = { path = "../celestina-rs/crates/fluorita-qt" }
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"
qt-build-utils = { version = "=0.9.1", features = ["qt_minimal"], optional = true }
qt-version = { version = "=0.1.5", features = ["qt_version_at_least_6_10"], optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
