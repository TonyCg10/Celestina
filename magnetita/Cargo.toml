[package]
name = "magnetita"
version = "1.2.3"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "magnetita"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# Playback capability and progress classification are pure protocol-domain
# contracts shared with the daemon; the Qt bridge only projects their result.
magnetita-core = { path = "../celestina-rs/crates/magnetita-core" }
# The mirror window decodes the phone's picture with the suite's engine
# (libmpv), the same one Fluorita's window and Siderita's preview use; the
# app never talks to libmpv, it opens an instance and hands the surface one
# opaque handle.
fluorita-engine = { path = "../celestina-rs/crates/fluorita-engine" }
# The engine's event vocabulary, to say why the picture stopped.
libmpv2 = "=6.0.0"
qrcode = { version = "0.14.1", default-features = false }
# The app is a thin client of the magnetitad service — it reads
# org.celestina.Devices1 over the session bus, no transport of its own.
zbus = "5"
# niri's IPC answers in JSON: the window, its workspace and output, so the
# mirror window can size itself to the tile it lands in.
serde_json = "1"

[build-dependencies]
# The render seam: the hand-written `QQuickFramebufferObject` that drives
# libmpv's render API, compiled from the crate that owns it.
fluorita-qt = { path = "../celestina-rs/crates/fluorita-qt" }
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
