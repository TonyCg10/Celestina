[workspace]
members = [
    "crates/celestina-core",
    "crates/celestina-shell-core",
    "crates/siderita-core",
    "crates/siderita-archive",
    "crates/siderita-embedded",
    "crates/siderita-ops",
    "crates/siderita-qt",
    "crates/dotfiles-core",
    "crates/fluorita-core",
    "crates/fluorita-engine",
    "crates/fluorita-qt",
    "crates/grafita-core",
    "crates/magnetita-core",
    "crates/magnetita-net",
    "crates/magnetita-proto",
    "crates/magnetita-link",
    "crates/magnetita-peer",
    "crates/magnetita-mobile",
    "crates/magnetitad",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
celestina-core = { path = "crates/celestina-core" }
# JSON is the KDE Connect wire format; serde earns its place as the one parser
# for packets with nested, per-plugin bodies (magnetita-core).
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# The own protocol is CBOR with integer keys (ADR 0001 in magnetita). minicbor
# encodes and decodes by hand from a borrowed slice, which is what lets every
# peer-chosen length be checked before a byte of it is copied (magnetita-proto).
minicbor = { version = "2.3", default-features = false, features = ["std"] }
# Pairing by six-digit code is SPAKE2 over Ed25519; the crate takes the RNG
# from its caller so the pure protocol crate stays deterministic under test.
spake2 = { version = "0.4", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false }
# The link is QUIC: quinn on the rustls/ring stack magnetita-net already pins,
# measured on the phone in MAG-P0 (magnetita-link). tokio is the runtime quinn
# needs; the daemon hosts it on one owned thread.
# The phone side reaches Kotlin through UniFFI; the crate carries its own
# bindgen binary, as UniFFI 0.29 intends (magnetita-mobile).
uniffi = "0.29"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
double_must_use = "allow"

