[package]
name = "siderita-embedded"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Containers that are really zip files (Android packages, EPUB books) are read
# with the same reader the archive domain uses, rather than a second one.
zip = { version = "2", default-features = false, features = ["deflate"] }

