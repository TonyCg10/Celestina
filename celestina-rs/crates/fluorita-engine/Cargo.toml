[package]
name = "fluorita-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
celestina-core.workspace = true
fluorita-core = { path = "../fluorita-core" }
# The decode backend, chosen by the author on 2026-07-30 from the measured F2
# spike (`fluorita/spikes/`): libmpv arrives as a complete engine — demux,
# decode, audio output, A/V sync, seek, hardware — driven by properties that map
# onto the playback model `fluorita-core` already froze, and it is the only
# candidate whose Qt Quick render path exists on this machine. `libmpv2` is the
# maintained binding: its whole runtime closure is itself plus `libmpv2-sys`,
# its bindings are pregenerated (no bindgen, no clang in the build), and it
# links the system `libmpv.so` rather than vendoring a media stack. The `render`
# feature is kept because the future Qt Quick surface needs that API; nothing
# here initializes it.
libmpv2 = "=6.0.0"

# Noticing that the library changed while it is open. Already the suite's
# watcher (Siderita's folder view uses the same crate, and learned the same
# lesson about coalescing and `Access` events), so this adds a dependency the
# closure already carries rather than a second way to watch a directory.
notify-debouncer-full = "0.5"

[lints]
workspace = true
