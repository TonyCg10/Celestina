[package]
name = "hematita-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Everything else this crate does is parse text the caller read from /proc and
# /sys into typed values; the standard library is the whole toolbox and a
# library would still leave hwmon and amdgpu to us.
[dependencies]
# CancellationToken and Generation are the suite's shared cancellation and
# staleness types; the storage walk, the duplicate check and the deletion stop
# on the same token the application already hands every worker.
celestina-core.workspace = true
# `rustix` for the `*at` syscalls (`openat`, `unlinkat`, `statat`, `fstat`,
# `Dir`): a permanent deletion that opens each directory once and removes
# children relative to that descriptor cannot be redirected by a component
# swapped for a symbolic link while it runs; `std` exposes no `unlinkat`.
# Safe Rust, `fs` feature only.
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
