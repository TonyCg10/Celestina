[package]
name = "cuprita-core"
version = "0.1.0"
edition = "2021"
description = "Cuprita's domain: networks, Bluetooth devices and audio endpoints, without Qt"
license = "MIT"

[dependencies]
# The NetworkManager client (`nm`), the BlueZ client and pairing agent
# (`bluez`) and the `snapshot` example speak to NetworkManager and BlueZ on
# the system bus. zbus is already the suite's D-Bus crate
# (Siderita, Cuprita's single-instance service); its blocking API keeps the
# client a plain call on Cuprita's worker threads. `async-io` is the runtime
# zbus's blocking calls run on: zbus refuses to build without one runtime,
# and this is the one the cuprita binary already carries. Behind the `nm`
# feature (`nm`, `bluez`) so the trait layer and the fakes stay free of D-Bus.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[features]
default = ["nm", "bluez"]
nm = ["dep:zbus"]
bluez = ["dep:zbus"]

[[example]]
name = "snapshot"
required-features = ["nm", "bluez"]
