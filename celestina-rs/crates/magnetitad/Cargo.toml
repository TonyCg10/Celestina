[package]
name = "magnetitad"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "magnetitad"
path = "src/main.rs"

[dependencies]
magnetita-core = { path = "../magnetita-core" }
magnetita-net = { path = "../magnetita-net" }
celestina-core.workspace = true
# The device contract (org.celestina.Devices1) on the session bus — the same
# zbus the suite's portal backend uses. Its blocking API keeps the daemon
# thread-based; zbus runs its own small executor for the served interface.
zbus = "5"
# Plugin settings persist as JSON in the config dir (settings.rs).
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Safe nonblocking pipes and process-group signals bound every playerctl
# subprocess tree without adding unsafe code to the daemon.
rustix = { version = "1.1.4", features = ["fs", "pipe", "process"] }

[lints]
workspace = true
