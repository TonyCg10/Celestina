[package]
name = "magnetita-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "magnetita_mobile"
crate-type = ["cdylib", "rlib"]

# The crate's own Kotlin bindings generator, run by the Android build with
# `--features bindgen` (magnetita-android/scripts/build-native.sh). Only it
# needs uniffi's bindgen and command-line stack (RS-13), so the feature is
# opt-in: the library, the phone's cdylib and every crate that links it
# build without that stack.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
magnetita-proto = { path = "../magnetita-proto" }
magnetita-link = { path = "../magnetita-link" }
magnetita-net = { path = "../magnetita-net" }
uniffi.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "io-util", "fs", "sync"] }

[lints]
workspace = true
