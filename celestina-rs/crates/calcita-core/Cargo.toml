[package]
name = "calcita-core"
version = "0.1.0"
edition = "2021"
description = "Calcita's domain: recent documents, zoom, reading positions, page input, search order and the annotation model, without Qt"
license = "MIT"

[dependencies]
# The recent store's file goes through the suite's shared owners: `pathkey`
# spells a path byte-exact in one text line, `atomic_file` replaces the store
# privately and reads it bounded, `xdg` names the data home.
celestina-core.workspace = true
# The annotation model is read (and, from CAL-2-B, written as incremental
# updates) by a pure-Rust PDF object parser; QtPdf renders but exposes no
# annotation objects, and nothing in the suite parses PDF. lopdf reads a
# page's `/Annots`, the AcroForm and the trailer (refusing `/Encrypt`), and
# its `IncrementalDocument` appends an update that keeps every original byte
# (the CAL-2 spike, 2026-10-11). Pinned exactly so the bytes it writes do not
# drift; without default features it brings no async runtime, no image
# decoder, no font parser and no thread pool (`chrono`, `jiff`, `time`,
# `image`, `skrifa`, `rayon`, `tokio`, `serde` all stay out).
lopdf = { version = "=0.45.0", default-features = false }
