[package]
name = "magnetita-net"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
# The suite's owner-only state writes (the private key, the certificate and the
# trust store) and its bounded read of the trust file.
celestina-core = { path = "../celestina-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The device certificate and key in rustls's types: the own link is QUIC with
# TLS 1.3 only, a self-signed certificate pinned by fingerprint rather than a
# CA chain, on the ring provider with no C toolchain. No TLS 1.2 and no log
# facade: nothing here speaks TLS 1.2 or installs a logger.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# One self-signed EC cert, generated in-process on first run and then pinned.
# Pinned to the ring backend so it shares rustls's provider and pulls no C
# toolchain (rcgen's default aws-lc-rs would want cmake); no openssl subprocess.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Already in the tree under rustls and rcgen; naming it directly costs no new
# crate and gives us SHA-256 for certificate fingerprints from the same backend.
ring = "0.17"

[lints]
workspace = true
