[package]
name = "hematita"
version = "1.3.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "hematita"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.9.1"
cxx-qt-lib = { version = "=0.9.1", default-features = false, features = [
    "qt_gui",
    "qt_qml",
    "qt_quickcontrols",
] }
# Everything the kernel reports, parsed and tested without Qt. This binary
# adds a window, a sampling thread and nothing else.
hematita-core = { path = "../celestina-rs/crates/hematita-core" }
# The suite's shared owners: the bounded `.desktop` lookup Hematita reads an
# application's name and icon through, the bounded reader of every kernel
# file, and the cancellation token of the storage workers.
celestina-core = { path = "../celestina-rs/crates/celestina-core" }
# Sending SIGTERM/SIGKILL, reading the clock tick rate, a mount's capacity
# and a command line opened without waiting (`statvfs` and `open`, the `fs`
# feature) without `unsafe`: rustix wraps the syscalls in
# safe Rust and is already pinned in the workspace by magnetitad at this exact
# version.
rustix = { version = "1.1.4", features = ["process", "param", "fs"] }
# The two buses: single-instance activation on the session bus (a second
# `hematita` raises the running window instead of mapping another one), and
# systemd on both buses, whose unit listing the sampler reads and whose unit
# actions the Services page asks for (through polkit on the system bus). The
# session bus is how the suite talks between processes and systemd has no
# other interface, so this earns zbus rather than a socket protocol.
zbus = "5"
# The suite's one trash implementation; the analyzer's trash verb goes through
# it, reversible from Siderita, instead of growing a second.
siderita-ops = { path = "../celestina-rs/crates/siderita-ops" }

[build-dependencies]
cxx-qt-build = "=0.9.1"
cxx-gen = "=0.7.176"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
